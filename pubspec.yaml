name: certificate_maker
description: صانع الشهادات الاحترافي - Professional Certificate Maker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  pdf: ^3.11.1
  image: ^4.2.0
  archive: ^3.6.1
  excel: ^4.0.6
  qr_flutter: ^4.1.0
  cryptography: ^2.7.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    - assets/fonts/
    - assets/sample_data/
